# Render blueprint — deploy with one click.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mutaz-portfolio
    runtime: node
    plan: free               # free plan: persistence is handled via GitHub commits
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      # Admin panel password (set the value in the Render dashboard).
      - key: ADMIN_PASSWORD
        sync: false
      # Auto-generated signing secret for admin sessions.
      - key: ADMIN_SECRET
        generateValue: true
      # GitHub token (contents: read/write on this repo). With it set, every
      # admin upload/edit is committed back to GitHub, so changes survive
      # redeploys and restarts on the free plan.
      - key: GITHUB_TOKEN
        sync: false
