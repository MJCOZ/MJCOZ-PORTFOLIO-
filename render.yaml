# Render blueprint — deploy with one click.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mutaz-portfolio
    runtime: node
    plan: starter            # paid plan required for a persistent disk
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      # Admin panel password (set the value in the Render dashboard).
      - key: ADMIN_PASSWORD
        sync: false
      # Auto-generated signing secret for admin sessions.
      - key: ADMIN_SECRET
        generateValue: true
      # Persistent storage paths (point at the mounted disk below) so admin
      # uploads/edits survive every redeploy and restart.
      - key: CONTENT_FILE
        value: /var/data/content.json
      - key: UPLOAD_DIR
        value: /var/data/uploads

    # Permanent storage for content + uploaded images.
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
